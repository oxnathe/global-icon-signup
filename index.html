<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Global Icon | Build. Learn. Become.</title>

    <meta
      name="description"
      content="Global Icon provides practical training in real estate, digital marketing and business development."
    />

    <meta
      name="keywords"
      content="Global Icon, real estate training, digital marketing, business development, real estate Nigeria"
    />

    <meta name="author" content="Global Icon" />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#080808"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Global Icon | Build. Learn. Become."
    />

    <meta
      property="og:description"
      content="Develop practical knowledge and skills in real estate, digital marketing and business development with Global Icon."
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Global Icon — Build. Learn. Become."
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Global Icon | Build. Learn. Become."
    />

    <meta
      name="twitter:description"
      content="Real estate training, digital marketing and business development."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="Global Icon — Build. Learn. Become."
    />

    <!-- Canonical URL
         Replace this after Vercel gives you the final domain -->
    <link
      rel="canonical"
      href="https://YOUR-VERCEL-DOMAIN.vercel.app/"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
